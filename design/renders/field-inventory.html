<!-- Operational Ledger Inline Interactions -->
<script>
    function adjustCount(elementId, delta, isDecimal) {
      const el = document.getElementById(elementId);
      if (!el) return;
      
      let currentVal = parseFloat(el.textContent.trim());
      if (isNaN(currentVal)) currentVal = 0;
      
      let nextVal = Math.max(0, currentVal + delta);
      el.textContent = isDecimal ? nextVal.toFixed(1) : Math.round(nextVal).toString();

      // Tactile visual feedback on modified ledger block
      const article = el.closest('article');
      if (article && !article.classList.contains('border-r-secondary')) {
        article.classList.add('border-r-4', 'border-r-secondary');
      }
    }

    function handleSaveLedger() {
      const cta = document.getElementById('save-cta');
      if (!cta) return;
      
      const originalHtml = cta.innerHTML;
      cta.classList.remove('bg-vermilion');
      cta.classList.add('bg-forest-green');
      cta.innerHTML = `
        <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>המלאי עודכן בהצלחה!</span>
      `;
      
      setTimeout(() => {
        cta.classList.remove('bg-forest-green');
        cta.classList.add('bg-vermilion');
        cta.innerHTML = originalHtml;
      }, 2000);
    }
  </script>
</body></html>
