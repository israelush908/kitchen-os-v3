<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kitchen OS v3.0 — יקב בוטיק מרכז מבקרים</title>
  <meta name="description" content="מערכת ניהול מטבח חכמה ודו-מצבית — ספירות שטח, הכנות, הזמנות וואטסאפ, פוד-קוסט ולייבור" />
  <meta name="theme-color" content="#0F1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kitchen OS" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%230F1115%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-family=%22monospace%22 font-weight=%22700%22 fill=%22%23FFFFFF%22 font-size=%2248%22>K3</text></svg>" />

  <!-- Google Fonts: Rubik (Hebrew UI) & Space Mono (Tabular Numerals) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />

  <!-- Design Tokens & Styles -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%230F1115%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-family=%22monospace%22 font-weight=%22700%22 fill=%22%23FFFFFF%22 font-size=%2248%22>K3</text></svg>" />
  <link rel="stylesheet" href="design/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body class="mode-field">
  <div id="app">
    <!-- ================= 1. GLOBAL HEADER (TopAppBar) ================= -->
    <header class="global-header">
      <div class="brand-section">
        <span class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
            <line x1="6" y1="17" x2="18" y2="17"/>
          </svg>
        </span>
        <div class="brand-titles">
          <span class="brand-title">Kitchen OS</span>
          <span class="brand-sub" dir="ltr">v3.0</span>
        </div>
      </div>

      <!-- מתג מצבים עליון: שטח מול משרד -->
      <div class="header-center">
        <div class="mode-switcher" role="radiogroup" aria-label="מצב מערכת">
          <button class="mode-btn active" id="btnModeField" role="radio" aria-checked="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
              <path d="M12 18h.01"/>
            </svg>
            <span>שטח</span>
          </button>
          <button class="mode-btn" id="btnModeOffice" role="radio" aria-checked="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="14" x="2" y="3" rx="2"/>
              <line x1="8" x2="16" y1="21" y2="21"/>
              <line x1="12" x2="12" y1="17" y2="21"/>
            </svg>
            <span>משרד</span>
          </button>
        </div>
      </div>

      <!-- אינדיקציית סנכרון וזמן -->
      <div class="header-actions">
        <div class="sync-badge" id="syncStatusBadge" title="סטטוס סנכרון מול הענן">
          <span class="sync-dot"></span>
          <span class="sync-text">מסונכרן</span>
        </div>
      </div>
    </header>

    <!-- ================= 2. MAIN VIEWPORT ================= -->
    <main class="app-viewport">
      <!-- 📱 FIELD MODE CONTAINER -->
      <section class="field-container" id="fieldContainer" aria-label="מצב שטח מובייל">
        <div class="field-content" id="fieldViewRoot">
          <!-- התוכן של לשונית השטח הפעילה יוזרק כאן -->
        </div>

        <!-- סרגל ניווט תחתון קבוע לשטח (FieldBottomNavBar - 4 יעדים R45) -->
        <nav class="field-bottom-nav" aria-label="סרגל ניווט שטח">
          <button class="nav-tab active" data-view="inventory" id="tabFieldInventory">
            <span class="tab-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                <path d="m3.3 7 8.7 5 8.7-5"/>
                <path d="M12 22V12"/>
              </svg>
            </span>
            <span class="tab-label">ספירת מלאי</span>
          </button>
          <button class="nav-tab" data-view="prep" id="tabFieldPrep">
            <span class="tab-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <path d="m9 14 2 2 4-4"/>
              </svg>
            </span>
            <span class="tab-label">הכנות וסרוויס</span>
          </button>
          <button class="nav-tab" data-view="orders" id="tabFieldOrders">
            <span class="tab-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
              </svg>
            </span>
            <span class="tab-label">הזמנות רכש</span>
          </button>
          <button class="nav-tab" data-view="waste" id="tabFieldWaste">
            <span class="tab-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                <line x1="10" x2="10" y1="11" y2="17"/>
                <line x1="14" x2="14" y1="11" y2="17"/>
              </svg>
            </span>
            <span class="tab-label">דיווח פחת</span>
          </button>
        </nav>
      </section>

      <!-- 🖥️ OFFICE MODE CONTAINER -->
      <section class="office-container" id="officeContainer" aria-label="מצב משרד דסקטופ">
        <!-- סרגל צדדי של משרד -->
        <aside class="office-sidebar" aria-label="תפריט מודולי משרד">
          <ul class="sidebar-menu">
            <li>
              <button class="sidebar-item-btn active" data-view="dashboard" id="tabOfficeDashboard">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                </span>
                <span>מרכז שליטה</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="studio" id="tabOfficeStudio">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/></svg>
                </span>
                <span>סטודיו מתכונים</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="catalog" id="tabOfficeCatalog">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                </span>
                <span>קטלוג ותקנים</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="deliveries" id="tabOfficeDeliveries">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                </span>
                <span>קבלת סחורה</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="prepManager" id="tabOfficePrepManager">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
                </span>
                <span>בנק הכנות וצ'קליסטים</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="labor" id="tabOfficeLabor">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                <span>בקרת לייבור</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="logs" id="tabOfficeLogs">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
                </span>
                <span>מרכז לוגים והיסטוריה</span>
              </button>
            </li>
            <li>
              <button class="sidebar-item-btn" data-view="settings" id="tabOfficeSettings">
                <span class="item-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                <span>הגדרות ויעדים</span>
              </button>
            </li>
          </ul>

          <div style="margin-top: auto; padding: var(--space-md); border-top: 1px solid var(--color-border-subtle); font-size: 12px; color: var(--color-text-dim);">
            <div>מרכז מבקרים יקב</div>
            <div class="mono" style="margin-top: 2px;">Kitchen OS v3.0 SPA</div>
          </div>
        </aside>

        <!-- אזור תוכן משרד -->
        <div class="office-content" id="officeViewRoot">
          <!-- התוכן של מודול המשרד הפעיל יוזרק כאן -->
        </div>
      </section>
    </main>
  </div>

  <!-- Main JavaScript App Bootstrapper -->
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
